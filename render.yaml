# Render blueprint.
#
# This site MUST run as a Node web service, not a static site. Next.js serves
# `src/app/api/*` from a running process: lead capture, job applications and
# the blog endpoints all live there, and on a static host every one of them
# answers 404 while the prerendered pages carry on looking fine. That failure
# is quiet — the contact forms post into nothing — so the service type is
# recorded here rather than left to the dashboard.
#
# Revalidation needs the same process: /resources is built with
# `revalidate: 3600` and cannot refresh without a server.

services:
  - type: web
    name: trackopinion
    runtime: node
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # `next start` binds whatever PORT Render provides.
      - key: NODE_VERSION
        # Must stay >= 22.22.2: jsdom 30, via isomorphic-dompurify in
        # src/lib/blog.ts, calls `markAsUncloneable`, which Node 20 lacks.
        # Matches .nvmrc.
        value: "24"
      - key: API_BASE_URL
        # Set in the Render dashboard. Without it every blog surface renders
        # empty, because `apiBaseUrl()` throws and the callers swallow it.
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        # Optional; the meta tag is omitted when this is empty.
        sync: false
