name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must stay >= 22.22.2. jsdom 30 (via isomorphic-dompurify, used to
          # sanitize CMS HTML in src/lib/blog.ts) pulls in undici 8, which does
          # `require('node:worker_threads').markAsUncloneable` at module load.
          # That function does not exist before Node 22.10, so on Node 20 the
          # build died with "webidl.util.markAsUncloneable is not a function"
          # the moment any route touched the sanitizer.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # next build does not run ESLint in Next 16, so it needs its own step —
      # this is why seven lint errors sat on main unnoticed.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Not a secret; the build degrades gracefully without it, but setting
          # it here means the blog routes are exercised in CI.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
